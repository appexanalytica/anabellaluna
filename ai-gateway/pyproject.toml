[project]
name = "anabella-ai-gateway"
version = "0.1.0"
description = "Cognitive AI Gateway for Anabella Luna Real Estate ERP/CRM"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",

    # AI / LLM
    "pydantic-ai>=0.2,<1.0",
    "openai>=1.60,<2.0",
    "anthropic>=0.40,<1.0",

    # Settings & validation
    "pydantic-settings>=2.5,<3.0",

    # Database
    "asyncpg>=0.30,<1.0",
    "pgvector>=0.3,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",

    # Redis (event bus + cache)
    "redis[hiredis]>=5.2,<6.0",

    # HTTP client (calls Node.js backend)
    "httpx>=0.28,<1.0",

    # Observability
    "langfuse>=2.0,<3.0",
    "opentelemetry-sdk>=1.28,<2.0",
    "opentelemetry-api>=1.28,<2.0",
    "opentelemetry-exporter-otlp>=1.28,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",

    # Async task queue
    "arq>=0.26,<1.0",

    # Google Generative AI
    "google-generativeai>=0.8,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "app*", "agents*", "analytics*", "embeddings*", "events*",
    "memory*", "observability*", "orchestrator*", "prompts*",
    "providers*", "queues*", "retrieval*", "tools*", "workflows*",
]

[tool.ruff]
target-version = "py312"
line-length = 120
