# ═══════════════════════════════════════════════════════════════════════════════
#  nginx.conf — Anabella Luna (completo, listo para producción)
#
#  Dominios gestionados:
#    anabellaluna.com.ar           → Frontend público (Vite)
#    www.anabellaluna.com.ar       → redirige a anabellaluna.com.ar
#    api.anabellaluna.com.ar       → Backend API Express + Socket.IO (puerto 4000)
#    admin.anabellaluna.com.ar     → Panel ERP/Admin (CRA build → admin/build/)
#    crm.anabellaluna.com.ar       → Portal CRM Agentes (CRA build → agents/build/)
#
#  ─── INSTALACIÓN ────────────────────────────────────────────────────────────
#  1. Copiar este archivo:
#       sudo cp /var/www/anabella/nginx.conf /etc/nginx/sites-available/anabellaluna
#       sudo ln -sf /etc/nginx/sites-available/anabellaluna /etc/nginx/sites-enabled/anabellaluna
#       sudo rm -f /etc/nginx/sites-enabled/default
#
#  2. Obtener certificado SSL (un solo cert para todos los subdominios):
#       sudo certbot certonly --nginx \
#         -d anabellaluna.com.ar -d www.anabellaluna.com.ar \
#         -d api.anabellaluna.com.ar \
#         -d admin.anabellaluna.com.ar \
#         -d crm.anabellaluna.com.ar
#
#  3. Validar y recargar:
#       sudo nginx -t && sudo systemctl reload nginx
#
#  ─── RENOVACIÓN AUTOMÁTICA (ya la configura certbot, verificar con) ─────────
#       sudo systemctl status certbot.timer
# ═══════════════════════════════════════════════════════════════════════════════

# ── Upstream backend (un solo punto para cambiar el puerto) ───────────────────
upstream backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ── HTTP → HTTPS (todos los dominios) ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name anabellaluna.com.ar www.anabellaluna.com.ar
                api.anabellaluna.com.ar
                admin.anabellaluna.com.ar
                crm.anabellaluna.com.ar;

    # Permitir challenge de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Variables SSL comunes (mismo cert para todos los subdominios) ──────────────
# Certbot con todos los -d en un solo comando genera:
#   /etc/letsencrypt/live/anabellaluna.com.ar/fullchain.pem

# ═══════════════════════════════════════════════════════════════════════════════
#  www → sin www (redirect permanente)
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.anabellaluna.com.ar;

    ssl_certificate     /etc/letsencrypt/live/anabellaluna.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anabellaluna.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://anabellaluna.com.ar$request_uri;
}

# ═══════════════════════════════════════════════════════════════════════════════
#  1. API  —  api.anabellaluna.com.ar → backend:4000
#     Proxy completo. Socket.IO WebSocket incluido.
#     Usado por: admin SPA, agents SPA (REACT_APP_API_URL=https://api.anabellaluna.com.ar)
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.anabellaluna.com.ar;

    ssl_certificate     /etc/letsencrypt/live/anabellaluna.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anabellaluna.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Archivos, documentos, imágenes (hasta 200 MB)
    client_max_body_size 200m;

    # ── Socket.IO (WebSocket) ────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ── Todo lo demás → backend Express ─────────────────────────────────────
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # CORS ya lo maneja Express — no duplicar headers aquí
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
#  2. ADMIN ERP  —  admin.anabellaluna.com.ar → admin/build/
#     SPA React estática. API y Socket.IO van a api.anabellaluna.com.ar.
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.anabellaluna.com.ar;

    ssl_certificate     /etc/letsencrypt/live/anabellaluna.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anabellaluna.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/anabella/admin/build;
    index index.html;

    gzip on;
    gzip_types text/html text/plain text/css application/json application/javascript application/x-javascript;
    gzip_min_length 1024;

    # Assets con hash (CRA) — caché larga
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA — todo va a index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
#  3. CRM AGENTES  —  crm.anabellaluna.com.ar → agents/build/
#     SPA React estática. API y Socket.IO van a api.anabellaluna.com.ar.
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.anabellaluna.com.ar;

    ssl_certificate     /etc/letsencrypt/live/anabellaluna.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anabellaluna.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/anabella/agents/build;
    index index.html;

    gzip on;
    gzip_types text/html text/plain text/css application/json application/javascript application/x-javascript;
    gzip_min_length 1024;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
#  4. FRONTEND PÚBLICO  —  anabellaluna.com.ar → frontend/dist/
#     Vite SPA. /api/ es proxy al backend (VITE_API_URL=/api).
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anabellaluna.com.ar;

    ssl_certificate     /etc/letsencrypt/live/anabellaluna.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anabellaluna.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/html text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # ── API proxy (Vite usa VITE_API_URL=/api) ───────────────────────────────
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Socket.IO para el frontend público ──────────────────────────────────
    location /socket.io/ {
        proxy_pass http://backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # ── Open Graph dinámico: /buy/:slug, /rent/:slug y /propiedad/:id ────────
    # /propiedad/:id es el link que copian admin/agents en "Compartir": los
    # crawlers de WhatsApp/iMessage no ejecutan JS, así que Express debe
    # inyectar los meta OG también en esa ruta (no servirla como SPA estático).
    location ~ ^/(buy|rent|propiedad)/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=300";
    }

    # ── Assets con hash — caché larga ───────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/anabella/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        root /var/www/anabella/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
